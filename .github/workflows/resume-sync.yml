name: resume-sync

# resume/resume.tex is the source of truth: regenerate the site data and the PDF from it.
on:
  push:
    branches: [main]
    paths: [resume/resume.tex]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run resume:sync
      # gate: nothing is committed if the generated data does not type-check and build
      - run: npm run build
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: resume.tex
          working_directory: resume
      - run: cp resume/resume.pdf public/resume.pdf
      # GITHUB_TOKEN pushes do not retrigger workflows, and the outputs are outside the paths filter
      - name: Commit regenerated files
        run: |
          git add src/data/*.json public/resume.pdf
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate site data and resume.pdf from resume.tex"
          git push
