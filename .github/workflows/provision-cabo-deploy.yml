name: provision-cabo-deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --disable-pip-version-check PyNaCl==1.5.0
      - name: Encrypt deployment token for Cabo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          token = os.environ['CLOUDFLARE_API_TOKEN']
          if not token:
              raise SystemExit('Deployment token is missing')
          key = PublicKey(base64.b64decode('66nSglxJ3PccRPzifd8xKbUlDAebiX/zdhrhvgmWcQs='))
          sealed = base64.b64encode(SealedBox(key).encrypt(token.encode())).decode()
          with open('cabo-deployment-secret.json', 'w') as output:
              json.dump({'key_id': '3380204578043523366', 'encrypted_value': sealed}, output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cabo-deployment-secret
          path: cabo-deployment-secret.json
          retention-days: 1
